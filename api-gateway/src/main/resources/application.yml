server:
  port: 8090

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/hotels/**,/api/chambres/**,/api/reservations/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/paiements/**,/api/notifications/**
            - id: reservation-service-docs
              uri: lb://reservation-service
              predicates:
                - Path=/docs/reservation-service/**
              filters:
                - RewritePath=/docs/reservation-service/(?<segment>.*), /${segment}
            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/docs/payment-service/**
              filters:
                - RewritePath=/docs/payment-service/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    urls:
      - name: api-gateway
        url: /v3/api-docs
      - name: reservation-service
        url: /docs/reservation-service/v3/api-docs
      - name: payment-service
        url: /docs/payment-service/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

keycloak:
  jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/hotelbook/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/hotelbook}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3100}
